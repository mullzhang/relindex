name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.4
      - run: mise run setup
      - run: mise run check
      - run: mise run verify:wheel

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.4
          install_args: python@${{ matrix.python }} uv@0.11.16
      - name: Test supported Python
        run: >-
          mise exec python@${{ matrix.python }} --
          uv run --locked --group examples --python ${{ matrix.python }} pytest
