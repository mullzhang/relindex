[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "relindex"
version = "0.1.0"
description = "Relational index-set modeling for mathematical optimization"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[dependency-groups]
dev = ["hypothesis>=6.130", "mypy>=1.15", "pytest>=8.3", "ruff>=0.11"]
examples = ["pulp>=4.0,<5", "pyomo>=6.10,<7", "highspy>=1.12"]
benchmark = ["duckdb>=1.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/relindex"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/examples", "/benchmarks", "/scripts",
    "/docs/api.md", "/docs/benchmarks.md", "/README.md", "/CONTRIBUTING.md",
    "/LICENSE", "/pyproject.toml", "/mise.toml", "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --import-mode=importlib"
markers = ["integration: model construction and solving with optional development dependencies"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/relindex"]
